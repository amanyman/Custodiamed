<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B71F8"/>
      <stop offset="100%" stop-color="#2E3FC7"/>
    </linearGradient>
    <linearGradient id="shield" x1="256" y1="96" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shield fill -->
  <path d="M256 96l152 76v124c0 92-62 152-152 184-90-32-152-92-152-184V172z" fill="url(#shield)"/>
  <!-- Shield outline -->
  <path d="M256 96l152 76v124c0 92-62 152-152 184-90-32-152-92-152-184V172z" fill="none" stroke="white" stroke-width="20" stroke-linejoin="round"/>
  <!-- Medical cross - vertical bar -->
  <rect x="230" y="200" width="52" height="140" rx="10" fill="white"/>
  <!-- Medical cross - horizontal bar -->
  <rect x="196" y="244" width="120" height="52" rx="10" fill="white"/>
</svg>
